name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No API keys and no database here on purpose: the rules engine is pure,
      # and the LLM contract test runs against the fake adapter. The live
      # provider tests skip themselves when credentials are absent.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
